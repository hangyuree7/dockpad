<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>DeckPad 설정</title>
<style>body{font-family:sans-serif;max-width:480px;margin:auto;padding:12px;background:#111;color:#eee}
button,input,select{font-size:16px;padding:10px;margin:4px 0;width:100%;box-sizing:border-box}
h3{margin:18px 0 4px;color:#4df}#log{font-size:12px;color:#9a9;white-space:pre-wrap}</style></head><body>
<h2>DeckPad 설정</h2>
<p>※ HTTPS(예: GitHub Pages)로 열어야 Web Bluetooth가 동작합니다. 먼저 폰 블루투스 설정에서 DeckPad를 페어링하세요.</p>
<button id="c">1. 연결</button>
<h3>시간</h3><button id="sync">폰 시간으로 동기화</button>
<h3>모드</h3><select id="mode"><option value="auto">자동</option><option value="dock">독 고정</option><option value="carry">휴대 고정</option></select>
<button id="setmode">모드 적용</button>
<h3>밝기</h3><input id="br" type="range" min="10" max="255" value="200"><button id="setbr">밝기 적용</button>
<h3>화면 방향</h3><select id="rot"><option value="0">세로</option><option value="1">가로</option><option value="2">세로 반전</option><option value="3">가로 반전</option></select><button id="setrot">적용</button>
<h3>화면 꺼짐 시간(휴대 모드)</h3><select id="tmo"><option value="0">15초</option><option value="1">30초</option><option value="2" selected>1분</option><option value="3">5분</option><option value="4">안 꺼짐</option></select><button id="settmo">적용</button>
<h3>화면 잠금(휴대 모드)</h3><select id="lock"><option value="1">켜기</option><option value="0">끄기</option></select><button id="setlock">적용</button>
<h3>와이파이 / PC 에이전트</h3>
<input id="ssid" placeholder="와이파이 이름"><input id="pass" type="password" placeholder="비밀번호">
<input id="host" placeholder="PC 주소 예: 192.168.0.10:8765"><input id="token" placeholder="에이전트 토큰">
<button id="setwifi">저장 후 재부팅</button>
<div id="log"></div>
<script>
const SVC="7d1c0001-5a1e-4b7e-9f3a-2b6c0d8e1a01",CMD="7d1c0002-5a1e-4b7e-9f3a-2b6c0d8e1a01",STAT="7d1c0003-5a1e-4b7e-9f3a-2b6c0d8e1a01";
let cmd,log=t=>document.getElementById('log').textContent=t+"\n"+document.getElementById('log').textContent;
const $=id=>document.getElementById(id);
$('c').onclick=async()=>{try{
 const d=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'DeckPad'}],optionalServices:[SVC]});
 const s=await(await d.gatt.connect()).getPrimaryService(SVC);
 cmd=await s.getCharacteristic(CMD); const st=await s.getCharacteristic(STAT);
 await st.startNotifications(); st.addEventListener('characteristicvaluechanged',e=>log("상태: "+new TextDecoder().decode(e.target.value)));
 log("연결됨");}catch(e){log("오류: "+e)}};
const send=async o=>{try{await cmd.writeValueWithResponse(new TextEncoder().encode(JSON.stringify(o)));log("전송: "+JSON.stringify(o).replace(/"pass":"[^"]*"/,'"pass":"***"'))}catch(e){log("오류: "+e)}};
$('sync').onclick=()=>send({t:Math.floor(Date.now()/1000),tz:-new Date().getTimezoneOffset()*60});
$('setmode').onclick=()=>send({mode:$('mode').value});
$('setbr').onclick=()=>send({bright:+$('br').value});
$('setrot').onclick=()=>send({rot:+$('rot').value});
$('settmo').onclick=()=>send({tmo:+$('tmo').value});
$('setlock').onclick=()=>send({lock:$('lock').value==='1'});
$('setwifi').onclick=()=>send({ssid:$('ssid').value,pass:$('pass').value,host:$('host').value,token:$('token').value,reboot:true});
</script></body></html>
